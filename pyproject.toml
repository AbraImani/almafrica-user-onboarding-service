[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almafrica-user-onboarding-service"
version = "0.1.0"
description = "Almafrica user onboarding and profile management API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.116,<1.0",
    "minio>=7.2,<8.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "pyjwt>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
